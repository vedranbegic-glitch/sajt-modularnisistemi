[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Stara adresa za upit vodi na postojecu stranicu za slanje projekta
[[redirects]]
  from = "/posaljite-upit/"
  to = "/posaljite-projekat/"
  status = 301
  force = true

[[redirects]]
  from = "/posaljite-upit"
  to = "/posaljite-projekat/"
  status = 301
  force = true

# Ranija adresa projektantske stranice vodi na novi URL
[[redirects]]
  from = "/3d-modelovanje-i-mehanizmi/"
  to = "/projektovanje-i-3d-modelovanje/"
  status = 301
  force = true

[[redirects]]
  from = "/3d-modelovanje-i-mehanizmi"
  to = "/projektovanje-i-3d-modelovanje/"
  status = 301
  force = true

# Bezbednosna zaglavlja za ceo sajt
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Astro generise fajlove sa hesom u imenu, pa se mogu trajno kesirati
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Slike se ponekad menjaju pod istim imenom, zato kraci rok
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Stranica zahvalnice ne treba da se pojavi u pretrazi
[[headers]]
  for = "/hvala/*"
  [headers.values]
    X-Robots-Tag = "noindex"
